name: 'Setup JDK + Gradle'
description: 'Common bootstrap: Temurin JDK 21 + the Gradle wrapper with caching.'
inputs:
  cache-read-only:
    description: >
      Pass 'true' on pull-request and publish jobs so they cannot write the
      Gradle cache — avoids cache poisoning from untrusted PR runs.
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: '21.0.13+9.0.LTS'
    - uses: gradle/actions/setup-gradle@v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
