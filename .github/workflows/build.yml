name: Build

on:
  push:
    # `wear-compose-cmp` is this line of work's trunk — the empty root commit the port is based on
    # — and `agent/…` are the branches that land on it. `main` is a different project.
    branches: [wear-compose-cmp, "agent/**"]
  pull_request:
    branches: [wear-compose-cmp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `check-port-revision.sh` diffs against the base branch, which a depth-1 checkout has no
          # merge base for.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # The generated sources are committed. This proves they are what the pipeline produces, so a
      # reviewer can read `modules/` as output rather than having to trust it.
      - name: Generated sources are up to date
        run: scripts/check-generated.sh

      # A change to what a consumer resolves must change the version they resolve, or publish.yml
      # skips it and the release silently does not happen. Pull requests only: on the trunk the
      # comparison has already been made, and the merge commit's own parent is the base.
      - name: A published change bumps the version
        if: github.event_name == 'pull_request'
        run: |
          # NOT --depth=1: the check diffs `base...HEAD`, which needs a merge base, and a shallow
          # fetch of the base shares no history with the PR branch — `fatal: no merge base`, exit 128.
          git fetch --no-tags origin "${{ github.base_ref }}"
          .github/scripts/check-port-revision.sh FETCH_HEAD

      # `assemble`, not `build`: see AGENTS.md -> Conventions.
      - name: Assemble
        run: ./gradlew assemble

      # The port's own tests, on the JVM — everything they cover is common code, and the JVM is
      # the target that runs them without a browser toolchain.
      - name: Test
        run: ./gradlew jvmTest

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-klibs
          path: modules/*/build/libs/*.klib
