name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build + discover previews
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `issues: read` for the locator check at the end of this job; everything else reads the tree.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble
        run: ./gradlew :catalog:assembleDebug :remote-catalog:assembleDebug --stacktrace

      # Discovery is the real contract for a design catalog: it is what turns the
      # `@CatalogComponent` / `@CatalogVariant` / `@OverrideVariant` annotations into the published
      # inventory. A component that compiles but is not discovered would silently vanish from the
      # sticker sheet, so run it on every change.
      # `:remote-catalog` is discovered alongside it for the same reason. Its inventory is still
      # spec-driven rather than annotation-driven, so discovery is not yet the whole contract there
      # — but it is what proves every `@Preview` the spec names still exists and still compiles
      # against the alpha Remote Compose line, which is the half that moves under this repo.
      #
      # `-PremoteSnapshot=` — an EMPTY property — forces the RELEASED lane. It is load-bearing:
      # `.github/ci/remote-snapshot-pin` turns the snapshot lane on by default for every Gradle
      # invocation (see AGENTS.md -> Dependencies), and the records checked below (`design-map.json`,
      # `kit-cells.json`, `docs/KIT_COVERAGE.md`) are committed and describe the released line. Let
      # the default through and this manifest holds snapshot-only components, both `--check`s report
      # stale against a sheet nobody committed, and regenerating at that point would commit those
      # components into a record CI validates on the released lane.
      - name: Discover previews
        run: >-
          ./gradlew :catalog:composePreviewDiscover :remote-catalog:composePreviewDiscover
          -PremoteSnapshot= --stacktrace

      # design-map.json is an OUTPUT — projected from the annotations that were just discovered —
      # and it is committed, so it can go stale the moment a component is added or a reference is
      # repointed. A stale map is silent in the worst way: parity keeps comparing yesterday's
      # components and the imported kit pages keep linking to previews that have moved. Checking it
      # here, in the job that already holds the manifest it is projected from, is the cheapest place
      # the drift can be caught.
      #
      # `--check` regenerates into a temp dir and diffs; it never writes the working tree.
      - name: design-map.json is up to date
        run: scripts/design-map.sh --check

      # kit-cells.json is the same argument one level down. It records how much of each published
      # kit set each sheet actually DRAWS — the question `kit-sets.json` does not ask, which is how
      # `:remote-catalog` came to draw 15 of the `Card` set's 45 cells with every test green
      # (#158). It is projected from both modules' resolved maps, so this is the job that holds its
      # inputs: both manifests were just discovered above.
      #
      # `--check` regenerates into a temp dir and diffs; it never writes the working tree, and it
      # never touches the committed map that belongs to `:catalog`.
      - name: kit-cells.json is up to date
        run: scripts/kit-cells.sh --check

      # The page join is the third committed output projected from the map, and it was the one with
      # no gate — which is exactly how it went stale. `design/pages/pages.json` records, per kit
      # node, the preview that implements it, and the server draws every node it does not know
      # about with a dashed red outline meaning "no code behind this". Recomputing it needs no
      # Figma token (it is a pure function of the cache and the map), but nothing re-ran it when
      # the map moved, so the Cards page reported 7 of 50 nodes implemented while the catalog was
      # drawing 36 of them. A reader cannot tell that from a real gap, which is the whole
      # value of the red.
      #
      # `--check` recomputes in memory and diffs; it never writes the working tree. A failure names
      # the one-line fix, and no token is needed to apply it.
      - name: The imported page join is up to date
        run: node scripts/import-figma-pages.mjs --check

      # The join above is `:catalog`'s, because the map it is projected from is — one design map
      # per checkout, and the committed one belongs to the Wear sheet. The Remote sheet's own join
      # is projected at publish time (`design-artifacts.yml`, `design-map-command`), so there is no
      # committed file here to reconcile; what CAN be checked without a second checkout is that
      # relinking against the Remote map reaches the whole of it. It did not, and nothing said so:
      # the published `/remote-m3/pages/` surface linked 22 of 1845 nodes — the component-level
      # references and nothing below them — while that sheet's map resolves 228 (#316).
      - name: The Remote sheet's page join reaches its whole map
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          scripts/design-map.sh --out-dir "$work" remote-catalog
          node scripts/import-figma-pages.mjs \
            --relink --design-map "$work/design-map.json" --require-full-join
          # `--relink` rewrote the committed cache, which belongs to `:catalog`. Put it back, so
          # the rest of this job reads the file this repository actually holds.
          git checkout -- design/pages/pages.json

      # The two sheets pair component by component through `parallel`, and until now nothing held
      # the declaration to what AGENTS.md says it means — one taxonomy, the same id, the same kit
      # node. Every way of breaking it is silent and a rename is when it breaks, which is why the
      # gate lives in the job that has just discovered both manifests.
      - name: The two sheets still pair
        run: scripts/parallel-map.sh

      # `docs/KIT_COVERAGE.md` reads the two records gated directly above and nothing else, so it
      # is a projection of files this job has already proved fresh — which is what makes gating it
      # honest rather than flaky. Its sibling `docs/COMPONENT_MAP.md` deliberately has no gate: that
      # one fetches the delivery branches for render paths, so a difference there can mean "a branch
      # republished", not "the doc is stale", and a check would fail for something no PR did.
      - name: docs/KIT_COVERAGE.md is up to date
        run: node scripts/kit-coverage.mjs --check

      # The fifth record projected from the annotations, and the only one that does not live in this
      # tree: the parity issue index, keyed on a `preview:` id inside each issue's
      # `compose-parity-locator/v1` block. The four checks above guard files against the
      # annotations; nothing guarded the issues, so renaming a cell pointed a locator at a preview
      # that no longer exists and every one of them stayed green. It happened twice from one rename
      # (#299, #300) and detached #293 and #284 from the compare page in silence — an issue whose
      # locator does not resolve lands exactly where an issue with no locator lands, which is
      # skipped. Filed as #305.
      #
      # THE CHECKER IS UPSTREAM, beside the parser it has to agree with. A locator is parsed by
      # `parity-issues.mjs`, and a second parser here would validate a subset while reporting on the
      # whole — the failure mode that hid #284 during the manual audit, whose CRLF body a
      # hand-rolled fence regex skipped. Same "check out the driver, run it with node" shape
      # `parity-issues.yml` already uses to reach the producer.
      # PINNED TO A COMMIT, not `main`. The checker is a GATE, and a gate that floats on another
      # repository's head can redden this one for a change nobody here made —
      # `scripts/design-map.sh` avoids exactly that by pinning its two upstream steps to exact
      # versions, and says why: both outputs are committed and CI fails on any difference. A gate
      # is the same bargain, since it decides whether a pull request here passes.
      #
      # It cannot pin the same way. Those two steps are published npm packages; this one is a
      # script in a git tree, so the version IS the commit. 26608e7 is compose-ai-tools#5214, which
      # added `check-parity-locators.mjs`. Bumping is a one-line commit, and the reason to bump is
      # a fix to the checker rather than a schedule.
      #
      # The `spec` job below checks the same repository out at `main`, left as it was: that one
      # predates this and runs a validator this repository has always taken from head. The path is
      # spelled the same in both so the two read as one driver.
      - name: Check out the locator checker
        uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 26608e78bc12c930ff03d09075f74ec2f7185656
          path: compose-ai-tools
          persist-credentials: false

      # The BASELINE, and what turns "some issue is broken" into "this pull request broke it". Each
      # delivery branch's `preview-index.json` is what the catalog last actually served, so an id
      # that was served and is not drawn in this tree is this change's doing, while one that was
      # never served is somebody's typo and only warns. Without it a single badly edited issue would
      # redden every later PR with the fix nowhere in its diff.
      #
      # `--depth=1` of two branch tips, for one file each: the delivery branches carry thousands of
      # renders and none of them are wanted here.
      - name: Fetch the served baselines
        run: |
          set -euo pipefail
          for system in wear-m3-catalog remote-m3; do
            git fetch --depth=1 origin "design-artifacts/$system"
            git show FETCH_HEAD:preview-index.json > "$RUNNER_TEMP/$system-index.json"
          done

      # `issues: read` is granted on this job alone — the workflow's default is `contents: read`,
      # and every other step here reads the tree.
      - name: Parity locators still name a cell this catalog draws
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node compose-ai-tools/scripts/design-artifacts/check-parity-locators.mjs \
            --repo ${{ github.repository }} \
            --manifest "wear-m3-catalog=catalog/build/compose-previews/previews.json" \
            --manifest "remote-m3=remote-catalog/build/compose-previews/previews.json" \
            --published "wear-m3-catalog=$RUNNER_TEMP/wear-m3-catalog-index.json" \
            --published "remote-m3=$RUNNER_TEMP/remote-m3-index.json"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: previews-manifest
          path: |
            catalog/build/compose-previews/previews.json
            remote-catalog/build/compose-previews/previews.json
          if-no-files-found: warn

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew test --stacktrace
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  ktfmt:
    name: ktfmtCheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - run: ./gradlew ktfmtCheck --stacktrace

  spec:
    name: Validate catalog spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: main
          path: compose-ai-tools
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
      # The build-free pre-flight: resolves every spec reference against the module's actual
      # `@Preview` functions and flags PNG-less previews, before the (long) render in
      # design-artifacts.yml spends a runner discovering the same problem.
      - name: validate-catalog-spec
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec catalog.spec.json --module-dir catalog

      # The Remote sheet's spec still carries its inventory as `groups`, so for THAT module this is
      # not a pre-flight over annotations but the check on the inventory itself: every `preview` and
      # `motionPreview` it names has to resolve to a real `@Preview`.
      - name: validate-catalog-spec (remote)
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec remote-catalog/catalog.spec.json --module-dir remote-catalog

  pages:
    name: Figma page resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
      # Which pages the import covers, and what each one is called. Both answers are published URLs
      # (`/{system}/pages/{id}`), and the page list is discovered from the Figma file rather than
      # hand-kept — so the slug rule is the only thing holding those URLs still. Needs no token:
      # it exercises the resolver against fixtures.
      - run: node --test scripts/import-figma-pages.test.mjs

      # What counts as a cell a sheet draws. The coverage record this decides is committed and
      # reconciled in the `map` job above, so a bug here would move every number in it at once and
      # the diff would look like a change to the catalog rather than to the counter.
      - run: node --test scripts/kit-cells.test.mjs

      # What counts as a broken pairing between the two sheets. The gate it backs runs in the `build`
      # job (it needs both discovered manifests); its pure half is fixture-driven and belongs here
      # beside the other script tests.
      - run: node --test scripts/parallel-map.test.mjs

      # The PR-body repair, which `pr-body-syntax.yml` runs UNATTENDED against real descriptions.
      # Both failure modes are silent: a matcher that over-reaches rewrites someone's prose, one
      # that under-reaches leaves the evidence images broken and the PR looking like the author
      # never rendered anything. It lives here rather than as a second job in that workflow because
      # this is where this repo already runs `node --test` over its scripts.
      - run: node --test .github/scripts/fix-pr-body-markdown.test.mjs

      # The snapshot probe's decision logic — what makes `remote-snapshot-probe.yml` ping a human
      # or stay quiet. Pure and stdlib-only, so it runs beside the resolver test rather than
      # needing the probe's own Pillow/Android environment. A watchdog whose comparison silently
      # stopped working would report "nothing changed" forever, which is the one failure mode it
      # cannot have.
      - run: python3 scripts/test_remote_snapshot_probe.py
