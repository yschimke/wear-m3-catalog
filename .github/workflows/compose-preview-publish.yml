name: Compose Preview Publish

on:
  workflow_run:
    workflows: [Compose Preview]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-preview-handoff
          path: _compose_preview_handoff
          run-id: ${{ github.event.workflow_run.id }}
      - id: pr
        run: echo "number=$(cat _compose_preview_handoff/_pr_number)" >> "$GITHUB_OUTPUT"
      - uses: yschimke/compose-ai-tools/.github/actions/apply@57a156a1beb9d14e52f1eca4bf5e0bcbdc562a22 # v2.28.4
        with:
          phase: publish
          pr-number: ${{ steps.pr.outputs.number }}
          artifact-repository: yschimke/wear-m3-catalog-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}
