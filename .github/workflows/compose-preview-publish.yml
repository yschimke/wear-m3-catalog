name: Compose Preview Publish

on:
  workflow_run:
    workflows: [Compose Preview]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compose-preview-handoff
          path: _compose_preview_handoff
          run-id: ${{ github.event.workflow_run.id }}
          # `run-id` is ignored without a token: the action then looks in THIS run, finds no
          # handoff, and fails with "Artifact not found", which it did on every run until this.
          github-token: ${{ github.token }}
      - id: pr
        run: echo "number=$(cat _compose_preview_handoff/_pr_number)" >> "$GITHUB_OUTPUT"
      - uses: yschimke/compose-ai-tools/.github/actions/apply@92a06f2ea364359eb2398ff125f5d88f4f22a75a # v2.40.0
        with:
          phase: publish
          pr-number: ${{ steps.pr.outputs.number }}
          artifact-repository: yschimke/wear-m3-catalog-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}
          # Check the PR's changed previews against this catalog's ui-builder.guidelines.json and
          # post a sticky comment. Skipped with a notice while the secret is unset.
          guidelines: 'true'
          guidelines-file: ui-builder.guidelines.json
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          guidelines-max-cost: '0.25'
