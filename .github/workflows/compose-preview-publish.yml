name: Compose Preview Publish

on:
  workflow_run:
    workflows: [Compose Preview]
    types: [completed]

permissions:
  actions: read
  # Read-only: renders are pushed to the -out repository with ARTIFACTS_TOKEN, not GITHUB_TOKEN.
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose-preview-handoff
          path: _compose_preview_handoff
          run-id: ${{ github.event.workflow_run.id }}
          # `run-id` is ignored without a token: the action then looks in THIS run, finds no
          # handoff, and fails with "Artifact not found", which it did on every run until this.
          github-token: ${{ github.token }}
      - id: pr
        # The handoff comes from the PR's run, so keep only digits before writing an output; the
        # apply action still checks the number against the workflow_run head.
        run: echo "number=$(tr -cd 0-9 < _compose_preview_handoff/_pr_number)" >> "$GITHUB_OUTPUT"
      - uses: yschimke/compose-ai-tools/.github/actions/apply@0f5f5cd98d20ac6f64f936fff53ed19988a4f24c # v2.79.2
        with:
          phase: publish
          pr-number: ${{ steps.pr.outputs.number }}
          artifact-repository: yschimke/wear-m3-catalog-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}
          # Check the PR's changed previews against this catalog's ui-builder.guidelines.json and
          # post a sticky comment. Skipped with a notice while the secret is unset.
          guidelines: 'true'
          guidelines-file: ui-builder.guidelines.json
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          guidelines-max-cost: '0.25'
          # Ask the largest size in each width class (216dp and 240dp of the five Wear sizes), not
          # every size: the five came back with the same findings. A named variant is always asked.
          # Ignored, with a warning, until the pinned action's CLI has --max-variants.
          guidelines-max-variants: size-class
          # Read the catalog publish's guideline results cache (design-artifacts.yml saves it under
          # `guidelines-<system>-`), read-only, so a preview already judged on main is not paid for
          # again.
          guidelines-cache-key: guidelines-wear-m3-catalog-
