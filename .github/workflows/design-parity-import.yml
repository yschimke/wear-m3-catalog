name: Design parity reference cache

# Import the Figma side on its own cadence. Design parity reads this committed cache and therefore
# makes zero live Figma calls on ordinary code pushes; a rate limit costs freshness, not coverage.

# Daily at 05:30 UTC, plus a button. This is the ONLY lane that may spend the Figma token on
# references: parity runs read the cache it commits and make zero calls (design-parity.yml), which
# is the split issue #289 exists for.
#
# Cheap on a quiet day, because the import is version-gated: an unchanged kit costs ONE request
# (the file `version` check) and refreshes nothing. The expensive path only runs when the kit has
# actually moved, so a daily cadence buys freshness rather than traffic.
#
# 05:30 and not m3-catalog's 04:30 on purpose. The token is per-user, so its rate limiter is shared
# across every repo that holds it — two catalogs importing at once would throttle each other. An
# hour's offset keeps them apart; each import is ~10-20 minutes when the kit has moved.
#
# The bootstrap this file used to wait on is done: `design-parity/reference` was filled on
# 2026-08-28 over four dispatched passes and reported `complete=true` — every mapped component at
# the kit's current version. `design-parity.yml` reads it with `require-reference-cache` (default
# true), so an empty or missing branch now fails loudly instead of silently fetching all 581
# references live, which is what it had been doing.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      design_parity_ref:
        description: Test an unreleased yschimke/design-parity ref instead of the published CLI.
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: design-parity-reference-import
  cancel-in-progress: false

jobs:
  import:
    name: M3 Wear OS Apps Design Kit
    if: ${{ github.repository == 'yschimke/wear-m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-import-reusable.yml@main
    permissions:
      contents: write
    with:
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}
      design-map-command: >
        ./gradlew :catalog:composePreviewDiscover --stacktrace &&
        scripts/design-map.sh
      timeout-minutes: 60
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}
