name: Design parity

# Compare the rendered catalog against the M3 Wear OS Apps Design Kit in Figma and publish the
# triptych report to the long-lived `design-parity/main` branch.
#
# The direction is **design-led** (`.design-parity.json`): this catalog exists to reproduce the
# published kit, so the kit is authoritative and a divergence is a bug in this code. That has teeth
# beyond reporting — Code-to-Canvas push-back is gated on `code-led`, so `design-led` makes writing
# back to the Figma file structurally impossible.
#
# Everything below the `uses:` line — install the CLI, discover, scope the render, compare, publish,
# apply the verdict — lives in design-parity's reusable workflow. This file is the configuration,
# not a copy of the pipeline.
#
# Runs on push to main and weekly, now that this catalog projects a non-empty design-map.json.
#
# It could not, for as long as the map projector paired a component's reference with its `_Light`
# capture: a Wear sticker is a single DARK capture, so nothing paired and the projection came back
# `0 mapped component(s)`. That is not a skip — design-parity dies on `no components: pass
# --components, or commit a design-map.json with entries` — so the workflow was dispatch-only to
# keep a known upstream gap from painting a red X on every push. The fallback to a catalog's sole
# capture landed upstream in `@yschimke/compose-design-map` v1.16.0
# (yschimke/compose-ai-tools#4196), and `design-map.json` is now committed: 49 components, 182
# references, 133 of them resolved onto the kit's own variant nodes. See docs/DESIGN_MAP.md.
#
# The remaining prerequisite is a `FIGMA_TOKEN` repository secret — a read-only PAT with
# `file_content:read`. That one makes the run skip with a notice rather than fail while absent.

# Scheduled, NOT per-push — and that is a throughput fact, not a preference.
#
# A parity run is one writer publishing a whole board, and it takes ~35-45 min end to end. Merges
# to `main` land every few minutes. Per-push, arrivals therefore outran service permanently, and
# the concurrency lane below could only resolve that by dropping work: GitHub keeps exactly ONE
# pending run per group and cancels any other, so on 2026-08-28 six of fifteen runs
# (#56, #57, #58, #60, #61, #64) were cancelled having never scheduled a single job, and the run
# that did survive started ~40 min after its commit landed. A board that skips most commits and
# publishes the rest three merges late is not a per-commit signal — it only looks like one.
#
# Hourly is what the lane can actually drain: one arrival per hour against a ~45 min service time
# leaves the queue empty between runs, so every scheduled run executes and none is evicted. The
# board tracks `main`'s tip within the hour instead of claiming a per-commit attribution it could
# never honour. Quiet hours are close to free — the `cache-paths` check below skips the whole run
# in ~40s when nothing that feeds the comparison has moved.
#
# Do not re-add a `push:` trigger. It cannot keep up while a run outlasts the merge interval, and
# re-adding it restores the eviction rather than the freshness it appears to buy. If per-commit
# parity is genuinely wanted, the run has to get under the merge interval first.
#
# Minute :17 rather than :00 deliberately — GitHub's scheduler is heavily oversubscribed at the top
# of the hour, and it keeps the hourly cron from ever colliding with the weekly one below, which
# `force-refresh` distinguishes by its exact expression.
on:
  schedule:
    # Hourly — the working cadence. Cache-gated, so it is a no-op when the catalog is quiet.
    #
    # NOT on the hour, and not a stylistic choice: GitHub delays scheduled events under load and
    # the top of the hour is when that load is. `:17` is the quiet minute this repo parks on.
    #
    # If this stops firing, the schedule has come UNREGISTERED rather than gone wrong — the
    # expression below is valid and the file is on the default branch, which is all a cron needs.
    # It happened when #117 first added this line: five slots passed with nothing, while every
    # other schedule in the repo fired exactly when due, and a dozen pushes to `main` for
    # unrelated files did not help. What re-registers it is a commit that touches THIS FILE, which
    # is what this comment is for. Check with
    #
    #   actions/list_workflow_runs design-parity.yml --event schedule
    #
    # before changing the expression: a correct cron edited on a guess loses the only clean signal
    # there is, because the edit itself re-registers and the two causes then look identical.
    - cron: "17 * * * *"
    # Weekly, early Monday UTC — the kit moves on its own schedule and a drift nobody pushed for
    # should still surface within the week. This is the one that forces a reference refresh.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      design_parity_ref:
        description: >
          Test an UNRELEASED design-parity: a git ref of yschimke/design-parity to build and run
          instead of the published CLI. Empty runs the release, which is what every scheduled run
          does.
        type: string
        required: false
        default: ""

permissions: {}

# ONE run at a time, and every one of them finishes.
#
# The group stays global on purpose: the jobs append their regenerated boards to
# `design-parity/main` and `design-parity/remote-m3`, so two runs publishing at
# once would race on the same branches. Serialising them is right, and
# `cancel-in-progress: false` is what keeps a run that has already paid for its
# render from being thrown away — the same shape `design-artifacts.yml` uses,
# for the same reason.
#
# What this lane is NOT is a way to absorb a faster arrival rate than it can
# serve. GitHub keeps only the newest *pending* run per group and cancels the
# rest, so queueing does not buffer a backlog — it silently discards one. That
# is what the per-push trigger produced, and the trigger is where it was fixed
# (see the comment above `on:`). With an hourly schedule the queue is empty
# between runs, so this group now only ever does its real job: keeping two
# publishers off the same branch, on the rare occasion a run overruns the hour.
concurrency:
  group: design-parity-artifacts
  cancel-in-progress: false

jobs:
  parity:
    name: Design parity
    if: ${{ github.repository == 'yschimke/wear-m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-reusable.yml@main
    permissions:
      contents: write # publish the regenerated artifacts to design-parity/main
    with:
      module: ':catalog'

      # Skip the run outright when nothing that feeds the comparison has moved: the module itself,
      # the version catalog the renderer is pinned from, and the build files that assemble them.
      cache-paths: catalog gradle build.gradle.kts settings.gradle.kts

      force-refresh: ${{ github.event.schedule == '0 5 * * 1' }}
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}

      # RED HERE MEANS BROKEN, not "the catalog still diverges".
      #
      # This workflow runs on `schedule` and `workflow_dispatch` only, so it gates nothing: there is
      # no PR for a blocking verdict to hold back. What blocking bought instead was a run that fails
      # on EVERY execution — the catalog is design-led and does still diverge, so the run rendered,
      # compared, published its board, and then exited 1 by design
      # ([#145](https://github.com/yschimke/wear-m3-catalog/issues/145)).
      #
      # A signal that is always red carries no information. Nobody could tell a render crash, a lost
      # reference cache or an expired token from the steady state without opening the log, so a real
      # breakage arrived looking exactly like every other run and read as more of the same.
      #
      # The verdict is not discarded. It lands on the job summary, as a warning annotation, and in
      # the reusable workflow's `blocked` output (yschimke/design-parity#430). What it no longer
      # does is own this job's colour. Where a divergence SHOULD gate — a pull request — leave the
      # default `true`.
      block-on-verdict: false

      # The daily import workflow owns all Figma traffic and commits a versioned, carry-forward
      # cache here. Ordinary parity runs are cache-only: no per-push API burst.
      reference-cache-branch: design-parity/reference

      shards: 1

      # Writes `catalog/build/compose-previews/previews.json` and projects design-map.json out of
      # it.
      design-map-command: >
        ./gradlew :catalog:composePreviewDiscover --stacktrace &&
        scripts/design-map.sh

      render-timeout: 1800
      timeout-minutes: 60
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}

  remote:
    name: Design parity (remote-m3)
    if: ${{ github.repository == 'yschimke/wear-m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-reusable.yml@main
    permissions:
      contents: write # publish the regenerated artifacts to design-parity/remote-m3
    with:
      module: ':remote-catalog'

      # Same policy as the job above, deliberately. `.design-parity.json` is repo-wide and says
      # `design-led`, so a divergence from the kit is a defect in this code — for the Remote
      # rendition too. That is the honest setting while the two sheets reproduce the same kit: a
      # Remote component that cannot draw what the kit specifies says so in its caption or KDoc,
      # which is the same rule `:catalog` follows for a Wear Compose gap.
      # `.github/ci/remote-snapshot-pin` is in the list for THIS job only, and it is the snapshot
      # switch below that puts it there. The gate asks "did any input move"; the pin decides what
      # this board is built from, so without it a bump would change the artifacts and the gate would
      # still re-apply the cached verdict. The `:catalog` job is not on the lane and does not need
      # the entry.
      cache-paths: remote-catalog gradle build.gradle.kts settings.gradle.kts .github/ci/remote-snapshot-pin

      force-refresh: ${{ github.event.schedule == '0 5 * * 1' }}
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}
      reference-cache-branch: design-parity/reference

      # Same reasoning as the job above, and this half needs it more: its verdict is usually the
      # CACHED one, re-applied because nothing moved since a run that already blocked. That path
      # failed in 0 seconds without rendering anything, which is the least informative red there is.
      block-on-verdict: false

      # A branch of its own. The job above publishes `design-parity/main`; two boards on one branch
      # would each look like the other had gone stale.
      artifact-branch: design-parity/remote-m3

      shards: 1

      # Projects the map for THIS module into ./design-map.json, which is the only path the action
      # reads (see scripts/design-map.sh). Safe because this job has its own workspace: the root map
      # committed for `:catalog` is regenerated here and never committed back.
      # ── THIS BOARD IS BUILT ON THE SNAPSHOT LANE ───────────────────────────────────────────
      # Deliberate, and the one place in this repo where a published artifact is drawn with
      # unreleased code. The Remote sheet reproduces a kit whose components `remote-material3` has
      # only just started publishing — the selection rows arrived after 1.0.0-alpha10 — and a board
      # that can only ever show the released line reports those kit sets as undrawn for as long as
      # the release takes. Comparing what we CAN draw against the kit is the whole job of this
      # board, so it is drawn against the line that can draw it.
      #
      # WHAT IT COSTS, stated plainly: this board is no longer reproducible from the released
      # artifacts alone. Rebuilding it needs the pinned snapshot below to still be downloadable
      # from androidx.dev, and those builds are not kept forever.
      #
      # PINNED, never `latest`. A floating pin would redraw the board from different bytes several
      # times a day with no commit to explain the change, and the parity verdict would move on its
      # own — which is the property that makes a board worth reading. Bump the pin deliberately, in
      # a commit, and read the visual diff: the same rule Compose and Horologist follow above.
      #
      # HOW, and why not `scripts/remote-snapshot-probe.py apply`. The probe's overlay rewrites the
      # checkout's `libs.versions.toml` and adds its own repository block, and it also injects a
      # four-density sweep that would quadruple every render on this board. None of that is needed
      # now: `settings.gradle.kts` and `remote-catalog/build.gradle.kts` read
      # `.github/ci/remote-snapshot-pin` themselves (AGENTS.md -> Dependencies), so the whole switch
      # is that one file and every Gradle invocation in the job is on the lane it names — including
      # the reusable workflow's own render step, which this file cannot pass arguments to and which
      # runs BEFORE `design-map-command`. `test -s` is the fail-closed guard: an empty pin is the
      # released lane everywhere, so without it this board could be built from a different lane than
      # the sheet beside it.
      #
      # Glance Wear is NOT snapshotted (see remote-catalog/build.gradle.kts): its
      # `WearWidgetPreview` is binary-incompatible with the pre-compiled wrapper the widget
      # stickers render through, and holding it back is what keeps all three of them drawing.
      design-map-command: >
        test -s .github/ci/remote-snapshot-pin &&
        ./gradlew :remote-catalog:composePreviewDiscover --stacktrace &&
        scripts/design-map.sh remote-catalog

      render-timeout: 1800
      timeout-minutes: 60
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}
