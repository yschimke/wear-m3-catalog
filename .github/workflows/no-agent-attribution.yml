name: No Agent Attribution

# Hard gate against AI-agent *identity* leaking into the permanent git history.
#
# AGENTS.md has stated the rule since the repo was set up, and `.githooks/`
# enforced it — but only locally, and only for text a local hook ever sees.
# That was not enough. `main` carries
#
#   7e203c38 fix(placeholders): give the placeholder stickers placeholder content (#59)
#     Co-authored-by: Claude <noreply@anthropic.com>
#
# which no local hook could have stopped: `main` is squash-only, and GitHub
# builds the squash commit message from the PR title + PR body and credits every
# distinct *branch commit author* as a co-author. Both inputs live server-side,
# after the last hook has run. A rule with no CI gate is a convention, and this
# is what a convention costs.
#
# Scope (deliberately narrow): we reject only the things that make the history
# claim an agent authored the work —
#   1. a `Co-authored-by:` trailer naming an agent (Claude, Codex, ChatGPT,
#      Copilot, Gemini) or using an agent email, and
#   2. a commit whose author or committer identity is an agent — either an
#      @anthropic.com / @openai.com email, or an agent *name*. GitHub App bot
#      accounts (…[bot]) are exempt: they only ever land on branches and never
#      reach `main`, which is squash-authored by the human who merges the PR.
#      `figma-pages.yml` commits its cache as `github-actions[bot]` for exactly
#      this reason.
# Links to an agent session (e.g. claude.ai/code) and the "🤖 Generated with …"
# / "_Generated by [Claude Code]_" footers are FINE and intentionally not
# matched, as are ordinary PR comments.
#
# Detection lives in `.github/scripts/agent-attribution-scan.sh`, which is
# already in this repo and already drives both hooks — this workflow adds no
# second implementation that could disagree with them. It is byte-identical to
# the copy in compose-ai-tools, and `scripts/test-agent-attribution.sh` covers
# it end to end.
#
# Untrusted text (PR title/body) is never interpolated into the shell; it is
# written to a file by github-script and read from there.
#
# Three jobs, because a check that only *warns* is not a gate:
#   • `scan` runs on the PR and is meant to BLOCK the merge. Make it a required
#     status check on the "Protect Main" ruleset — without that a red run is
#     merely advisory and can be merged straight past.
#   • `drift` runs on every push to `main` and fails loudly if attribution got
#     in anyway. It cannot prevent the commit, but it makes the breach visible
#     and dates it to a single push instead of leaving it to be noticed months
#     later.
#   • `self-test` runs the detector's own tests, because its failure mode is
#     silent: a matcher that quietly stops matching still exits 0 and still
#     reports "no agent attribution found".

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # `scan` re-reads the PR's current title/body; see below.

# PR runs dedupe; push runs deliberately do NOT.
#
# Superseding PR runs is only sound because `scan` re-reads the PR's current
# title and body instead of trusting its own event payload. Group execution
# order is NOT guaranteed, so an older `edited` run can enter the group after a
# newer one and cancel it. If each run validated the text frozen into its own
# payload, the survivor could certify a body that has since gained a prohibited
# trailer — and because both edits share a head SHA, that stale-clean check
# would satisfy the required gate.
#
# Push runs are keyed per-RUN so they never share a group and can never cancel
# each other. That is load-bearing: `drift` scans only the commits *this push*
# added to main, so it is not idempotent across commits. Any shared group would
# let GitHub cancel a pending run — it keeps only the newest pending per group
# even with `cancel-in-progress: false` — and the commits that run was going to
# scan would never be checked by anything.
#
# `github.run_id`, not `github.sha`: a SHA is not unique per push event. A
# force-push can make an earlier SHA the tip again (X→A, A→B, B→A), which would
# put two push events in one group and evict the pending run for the first.
# This workflow exists to handle force-pushed history, so it cannot assume tips
# are never revisited.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Reject agent attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read the PR's title and body from the API, NOT from this run's event
      # payload. The payload is a snapshot of one `edited` event; a run holding
      # a stale one can outlive the run holding the current one (see the
      # concurrency note above), and the gate would then pass on text nobody
      # will actually merge. The API always answers with what the squash commit
      # would be built from right now.
      #
      # Writing the file here also keeps untrusted text out of the shell.
      - name: Read the PR's current title and body
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            })
            const fs = require('node:fs')
            fs.writeFileSync('pr_text.txt', `${pr.title ?? ''}\n${pr.body ?? ''}\n`)

      - name: Scan commit identities and Co-authored-by trailers
        env:
          # The commit range stays on the payload: this check reports against
          # the head SHA of the event that started it. Only the metadata is
          # re-read.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          .github/scripts/agent-attribution-scan.sh \
            --range "${BASE_SHA}..${HEAD_SHA}" --text-file pr_text.txt
          status=$?
          # 2 means the scan could not run (unresolvable revision). That is not
          # "clean" and it is not "found" either — say so, rather than printing
          # the attribution message for what is actually a broken checkout.
          if [ "$status" -eq 2 ]; then
            printf '::error::Agent-attribution scan could not run\n'
            echo "Could not resolve ${BASE_SHA}..${HEAD_SHA}. The scanner fails" >&2
            echo "closed rather than reporting clean — check the checkout depth." >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '::error::Agent attribution found in this PR\n'
            cat >&2 <<'MSG'

          ───────────────────────────────────────────────────────────────
          This PR would attribute work to an AI agent in git history.
          Commits are attributed solely to the human committer.

          NOT allowed:
            • a Co-authored-by: trailer naming an agent (Claude, Codex,
              ChatGPT, Copilot, Gemini) or using an agent email
            • a commit whose author/committer identity is an agent — an
              @anthropic.com / @openai.com email, or an agent name (Claude,
              Codex, …). GitHub App bots (…[bot]) are exempt.

          Fine (left untouched): links to an agent session, the "Generated
          with …" / "Generated by [Claude Code]" footers, and ordinary PR
          comments.

          MERGING PAST THIS CHECK DOES NOT AVOID IT. GitHub's squash credits
          every distinct branch commit author as a co-author, so an agent
          identity above becomes a real

            Co-authored-by: Claude <noreply@anthropic.com>

          trailer on main. Repoint the identity and force-push the branch:

            git config user.name  "<your name>"
            git config user.email "<your email>"
            git rebase --exec 'git commit --amend --no-edit --reset-author' \
              origin/main

          And remove any Co-authored-by line from the PR description too, not
          just the commits.
          ───────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

  drift:
    # Post-merge backstop. `scan` can only block a merge when it is a required
    # status check; until then (and against admin overrides / direct pushes)
    # this makes a breach loud and pins it to one push, instead of it sitting
    # undiscovered in the permanent history — which is exactly how 7e203c38
    # went unnoticed.
    name: Main history has no agent attribution
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the commits this push added to main
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Determining WHAT this push added is the whole job, and getting it
          # wrong silently under-scans. Three cases:
          #
          #  • Branch creation — `before` is all-zero. Scan everything reachable
          #    from the new tip; there is no earlier state to diff against.
          #  • Ordinary push / squash merge — `before` is the previous tip and
          #    `fetch-depth: 0` has it. Scan before..after.
          #  • Force push — `before` is ALSO the previous tip (GitHub does not
          #    zero it; it flags `forced` separately), but that commit may now be
          #    unreachable and so absent from the clone. Try to fetch it by sha.
          #
          # If the old tip cannot be resolved even after fetching, we do NOT
          # narrow to the tip commit: a multi-commit force push would then hide
          # attribution in every replacement commit but the last. We fail
          # instead — a red main run demanding a manual look is the correct
          # outcome for a gate that cannot see its own scope.
          if [ -z "${BEFORE_SHA//0/}" ]; then
            range="${AFTER_SHA}"
            echo "Branch creation — scanning all history reachable from ${AFTER_SHA}"
          else
            if ! git rev-parse --quiet --verify "${BEFORE_SHA}^{commit}" >/dev/null; then
              echo "Previous tip ${BEFORE_SHA} not in the clone (force push?) — fetching it"
              git fetch --no-tags --quiet origin "${BEFORE_SHA}" || true
            fi
            if ! git rev-parse --quiet --verify "${BEFORE_SHA}^{commit}" >/dev/null; then
              printf '::error::Cannot determine what this push added\n'
              cat >&2 <<MSG

          The previous tip ${BEFORE_SHA} could not be resolved, even after
          fetching it by sha, so the set of commits this push added to main is
          unknown. Scanning only ${AFTER_SHA} would silently miss every other
          commit of a multi-commit force push, so this job fails instead.

          Check the pushed commits by hand:
            git fetch origin main && git log --format='%H %an <%ae>' origin/main
          MSG
              exit 1
            fi
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          echo "Scanning ${range}"

          .github/scripts/agent-attribution-scan.sh --range "$range"
          status=$?
          if [ "$status" -eq 2 ]; then
            printf '::error::Agent-attribution scan could not run\n'
            echo "The scanner could not resolve '${range}'. It fails closed rather" >&2
            echo "than reporting clean — investigate before trusting this push." >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '::error::Agent attribution reached main\n'
            cat >&2 <<'MSG'

          ───────────────────────────────────────────────────────────────
          Agent attribution is present in commits just pushed to main.

          The PR-layer check either was not a required status check, was
          overridden, or was bypassed by a direct push. Fixing this now means
          rewriting published history — weigh that against anything already
          pointing at it before you do.

          To stop it recurring, make "Reject agent attribution" a REQUIRED
          status check on the Protect Main ruleset.
          ───────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

  self-test:
    # The detector is the only thing standing between an agent identity and the
    # permanent history, and its failure mode is silent. So it gets its own
    # tests, run on every PR and every push, driving the real script and both
    # hooks end to end.
    name: Detector self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run the agent-attribution self-test
        run: scripts/test-agent-attribution.sh
