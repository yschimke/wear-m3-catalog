name: Publish

# Publishes the port as a Maven repository a wasm consumer can resolve from WITHOUT credentials.
#
# GitHub Packages needs a token even to read, which makes it useless as the primary lane: the UI
# builder would have to carry one in its own CI to build at all. So the artifacts are published as
# a plain Maven tree on the `wear-compose-cmp-maven` branch of the public output repository,
# `yschimke/wear-m3-catalog-out`, beside the design artifacts, so this source repository carries no
# generated branch (#604). raw.githubusercontent serves it as a static repository over HTTPS:
#
#   maven("https://raw.githubusercontent.com/yschimke/wear-m3-catalog-out/wear-compose-cmp-maven/")
#
# GitHub Packages is published to as well, for anyone who prefers it.
#
# A PUBLISHED VERSION IS IMMUTABLE. The version is `<upstream>-cmp<portRevision>`, both from
# upstream.json, so it does not change when a commit lands — and republishing it would either
# silently move what a consumer already resolved (the Maven branch) or fail outright (GitHub
# Packages answers 409 Conflict, which is what taught us this). So the job checks first and skips
# when the version is already out; publishing a change against an unchanged upstream version means
# bumping `portRevision`.

on:
  push:
    # The trunk only. A working branch that has not been reviewed yet must not be able to move
    # what a consumer resolves.
    branches: [wear-compose-cmp]
  workflow_dispatch:
    inputs:
      republish:
        description: "Overwrite the version on the Maven branch even if it is already published"
        type: boolean
        default: false

concurrency:
  # The publish branch is read, added to, and pushed; two runs racing on it would interleave trees.
  group: publish-wear-compose-cmp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MAVEN_REPOSITORY: yschimke/wear-m3-catalog-out
      # ARTIFACTS_TOKEN is the credential the design-artifacts lanes already push to the output
      # repository with; github.token cannot write outside this repository.
      MAVEN_REMOTE: https://x-access-token:${{ secrets.ARTIFACTS_TOKEN }}@github.com/yschimke/wear-m3-catalog-out.git
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version and the published tree
        id: state
        run: |
          set -euo pipefail
          version=$(./gradlew -q printPortVersion)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          tree="$RUNNER_TEMP/maven"
          if git ls-remote --exit-code --heads "$MAVEN_REMOTE" wear-compose-cmp-maven >/dev/null 2>&1; then
            git clone -q --depth 1 --branch wear-compose-cmp-maven "$MAVEN_REMOTE" "$tree"
          else
            git init -q "$tree"
            git -C "$tree" checkout -q --orphan wear-compose-cmp-maven
          fi
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          # One artifact's directory is enough to tell whether this version is already out: the
          # tree is written in a single commit, so it is never half published.
          if [ -d "$tree/ee/schimke/wearcmp/wear-compose-material3/$version" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already published
        if: steps.state.outputs.published == 'true' && !inputs.republish
        run: |
          # An annotation as well as the summary: a skip is indistinguishable from a successful
          # publish in the Actions list otherwise, and that is exactly how #398 and #400 went
          # unpublished for a day. `build.yml` now fails a pull request that would cause this, so
          # reaching here means either a republish or a trunk push that changed nothing published.
          echo "::notice title=Nothing published::${{ steps.state.outputs.version }} is already on the Maven branch; every publishing step was skipped."
          {
            echo "### ${{ steps.state.outputs.version }} is already published"
            echo
            echo 'Nothing to do. A published version is immutable — to publish a change against an'
            echo 'unchanged AndroidX version, bump `portRevision` in `upstream.json`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the repository tree
        if: steps.state.outputs.published == 'false' || inputs.republish
        run: ./gradlew publishToBuildDir

      # Not conditional on `republish`: GitHub Packages rejects a re-upload with 409 whatever we
      # think, so the only safe thing to do with an already-published version is leave it alone.
      # GitHub Packages refuses to overwrite a release version (409 Conflict), and it is not the Maven
      # branch: it can hold a version the branch lacks, as the Remote Compose port's did when its
      # branch was lost (#606 in the main line). So every module is offered with --continue, and only
      # a failure that is not a 409 fails the step; the branch push below always gets its turn.
      - name: Publish to GitHub Packages
        if: steps.state.outputs.published == 'false' || inputs.republish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # The runner starts bash with -e -o pipefail; +e lets the check below read the failures.
          set +e -uo pipefail
          log="$RUNNER_TEMP/github-packages.log"
          ./gradlew --continue publishAllPublicationsToGitHubPackagesRepository 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          [ "$status" = 0 ] && exit 0
          failed=$(grep -c '^Execution failed for task' "$log" || true)
          conflicts=$(grep -c 'Received status code 409 from server' "$log" || true)
          if [ "$failed" -gt 0 ] && [ "$failed" = "$conflicts" ]; then
            echo "::notice::$conflicts publication(s) already in GitHub Packages; left as they are."
            exit 0
          fi
          exit "$status"

      - name: Push the Maven tree
        if: steps.state.outputs.published == 'false' || inputs.republish
        run: |
          set -euo pipefail
          version="${{ steps.state.outputs.version }}"
          tree="${{ steps.state.outputs.tree }}"

          # Copy over the existing tree rather than replacing it: a consumer pinned to an older
          # version has to keep resolving.
          cp -r build/maven/. "$tree/"
          git -C "$tree" add -A
          if git -C "$tree" diff --cached --quiet; then
            echo "the published tree is already identical" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$tree" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "chore: publish $version"
          git -C "$tree" push -q "$MAVEN_REMOTE" "HEAD:wear-compose-cmp-maven"

          {
            echo "### Published $version"
            echo
            echo '```kotlin'
            echo 'maven("https://raw.githubusercontent.com/${{ env.MAVEN_REPOSITORY }}/wear-compose-cmp-maven/")'
            echo "implementation(\"ee.schimke.wearcmp:wear-compose-material3:$version\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
