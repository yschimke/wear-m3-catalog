name: Typed M3 catalogs

on:
  # A dispatch from main republishes the pilot; from any other ref it only validates.
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalog-typed-*/**'
      - '**/src/**'
      - '**/catalog.spec.json'
      - 'catalog.spec.json'
      - 'scripts/validate-typed-m3-catalogs.sh'
      - '**/ui-builder.policy.json'
      - 'ui-builder.policy.json'
      - 'gradle/libs.versions.toml'
      - 'scripts/validate-typed-m3-policies.sh'
      - 'scripts/validate-typed-wear-renderer.sh'
      - 'scripts/verify-typed-wear-runtime.mjs'
      - 'ui-builder.guidelines.json'
      # The templates `generateTypedCatalog` re-pins and copies into the pilot pair.
      - 'ui-builder/designs/**'
      - '.github/workflows/typed-catalog.yml'
  # Publish the pilot after a change to its inputs lands. Same paths as the pull-request check:
  # what the check validates is exactly what the publish job ships.
  push:
    branches: [main]
    paths:
      - 'catalog-typed-*/**'
      - '**/src/**'
      - '**/catalog.spec.json'
      - 'catalog.spec.json'
      - 'scripts/validate-typed-m3-catalogs.sh'
      - '**/ui-builder.policy.json'
      - 'ui-builder.policy.json'
      - 'gradle/libs.versions.toml'
      - 'scripts/validate-typed-m3-policies.sh'
      - 'scripts/validate-typed-wear-renderer.sh'
      - 'scripts/verify-typed-wear-runtime.mjs'
      - 'ui-builder.guidelines.json'
      # The templates `generateTypedCatalog` re-pins and copies into the pilot pair.
      - 'ui-builder/designs/**'
      - '.github/workflows/typed-catalog.yml'

permissions:
  contents: read

# A newer run on the same ref supersedes an older one. On main that is what keeps an older run from
# publishing after a newer one and rolling the delivery branch back; `publish` also checks that its
# commit is still main's tip right before it pushes, for a run that is already past this point.
concurrency:
  group: typed-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      # The builder's projected export at its v3.109.0 release: frame slots, projected Material
      # icons, item roles and builtins routed through typed projections.
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ui-builder
          ref: 34701265c982e3fb50f7d2f91332a705cff84bd7 # v3.109.0
          path: .typed-builder
      # The tools API the typed renderer bridge builds against, from source until the builder's
      # bridge leaves its experiment. v2.52.0: target modifier links, the Material icon codec,
      # builtin implementations and frame slots, which the real-record definitions in `typed/real`
      # use.
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 9310fba0525c3d146736f23aa95626cac5ac8e21 # v2.52.0
          path: .typed-tools
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate independent Kotlin policies
        run: scripts/validate-typed-m3-policies.sh
      - name: Validate complete Kotlin catalog pairs
        run: scripts/validate-typed-m3-catalogs.sh
      - name: Validate Wear renderer fixes on JVM and Wasm
        run: >-
          xvfb-run -a ./gradlew -PcomposeUiBuilderDir=.typed-builder
          :ui-builder-wear-adapters:compileKotlinWasmJs :ui-builder-wear-adapters:jvmTest
          --tests '*WearCatalogCoverageTest' --tests '*WearTwoWayBindingTest'
          --tests '*WearColorLiteralTest'
      - name: Validate the typed Wear renderer pilot
        run: >-
          xvfb-run -a scripts/validate-typed-wear-renderer.sh .typed-tools .typed-builder
      - name: Exercise the packaged typed Wear runtime in Chromium
        run: node scripts/verify-typed-wear-runtime.mjs .typed-builder
      # The inputs typed-catalog-artifacts-reusable.yml checks, assembles and publishes as
      # `design-artifacts/wear-m3-typed-pilot`: the pilot pair with its templates (already pinned
      # to the pilot), the runtime, the production guidelines (re-addressed by the workflow), the
      # readiness report AFTER the browser check, and the typed side of each JVM parity case as the
      # catalog's images. Staged on every run so a pull request proves the tree assembles.
      - name: Stage the wear-m3-typed-pilot inputs
        run: |
          set -euo pipefail
          build=catalog-typed-adapters/build
          in="$RUNNER_TEMP/typed-pilot-inputs"
          mkdir -p "$in/images"
          cp -R "$build/catalog" "$in/catalog"
          cp "$build/distributions/wear-m3-typed-pilot-renderer.zip" "$in/runtime.zip"
          cp ui-builder.guidelines.json "$in/guidelines.json"
          cp "$build/browser-evidence/readiness.json" "$in/readiness.json"
          cp "$build"/render-evidence/parity/*-typed.png "$in/images/"
          find "$in" -type f | sort
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wear-m3-typed-pilot-inputs
          path: ${{ runner.temp }}/typed-pilot-inputs/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typed-m3-policies
          path: |
            catalog-typed-generator/build/catalog/
            catalog-typed-generator/build/reports/tests/
            catalog-typed-policy/build/catalog/
            catalog-typed-policy/build/reports/tests/
            ui-builder-wear-adapters/build/reports/tests/
            catalog-typed-adapters/build/catalog/
            catalog-typed-adapters/build/render-evidence/
            catalog-typed-adapters/build/browser-evidence/
            catalog-typed-adapters/build/reports/tests/
            catalog-typed-adapters/build/distributions/

  # Publish the pilot as its own catalog, `design-artifacts/wear-m3-typed-pilot` on the same output
  # repository and in the same layout as the production `wear-m3-catalog` branch, so a preview
  # server can serve it beside production `wear-m3` for A/B export testing. Production delivery
  # (design-artifacts.yml) neither reads nor writes this branch.
  #
  # compose-ai-tools' shared typed-catalog workflow does the checking, assembly and push: export
  # selection, projections, templates, guidelines, runtime integrity, the browser verification of
  # THIS runtime, and at least one image (a server refuses a catalog without). Its publish job runs
  # nothing of this repository's, pushes only from main, and only while this run's commit is still
  # main's tip. A pull request assembles and uploads the tree without publishing.
  typed-pilot:
    name: wear-m3-typed-pilot
    needs: validate
    permissions:
      contents: read
    uses: yschimke/compose-ai-tools/.github/workflows/typed-catalog-artifacts-reusable.yml@a0ac6dbbd4a00d9226790a5ba7e3449e8912de9c # v2.79.0
    with:
      system: wear-m3-typed-pilot
      artifact: wear-m3-typed-pilot-inputs
      guidelines-path: guidelines.json
      readiness-path: readiness.json
      require-browser-verification: true
      images-path: images
      image-variant: typed
      image-component-prefix: typed-pilot/
      image-section: Typed pilot
      image-group: JVM parity
      image-caption: 'Typed renderer, parity case {name}'
      renderer: wear-m3-catalog catalog-typed-adapters
      artifact-repository: yschimke/wear-m3-catalog-out
      publish: ${{ github.repository == 'yschimke/wear-m3-catalog' && github.event_name != 'pull_request' }}
    secrets:
      artifacts_token: ${{ secrets.ARTIFACTS_TOKEN }}
