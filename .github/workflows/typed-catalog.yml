name: Typed M3 policies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalog-typed-policy/**'
      - '**/ui-builder.policy.json'
      - 'ui-builder.policy.json'
      - 'gradle/libs.versions.toml'
      - 'scripts/validate-typed-m3-policies.sh'
      - '.github/workflows/typed-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate independent Kotlin policies
        run: scripts/validate-typed-m3-policies.sh
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: typed-m3-policies
          path: |
            catalog-typed-policy/build/catalog/
            catalog-typed-policy/build/reports/tests/
