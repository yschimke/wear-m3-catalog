# Kotlin
kotlin.code.style=official

# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose Preview
#
# Capture Remote Compose documents against `RemoteDensity.Host` rather than folding density and
# font scale in as constants at capture time. This is what makes `?fontScale=` on a `remote-m3`
# sticker do anything: the default (`fixed`) resolves every sp->px before a byte is written, so the
# published documents answered a font-scale request with byte-identical pixels.
#
# Under `host` the conversions become expressions over the player's own `FLOAT_DENSITY` and
# `FONT_SIZE` variables, resolved at paint time. That defers *density* as well as font scale, so
# the replay density becomes a correctness input where it used to be ignored — serve resolves it
# from each preview's declared device (`renderDensityFor`), which is the same source the bake used,
# so the two agree and geometry stays where the baked PNG has it.
#
# Playing such a document needs a player that resolves the deferred sizes: rc-players 2.0.4
# (rc-players#558) is the first whose embedded and CMP players both draw its text. On that line
# the whole sheet renders pixel-identical to a `fixed` capture at fontScale 1.
composePreview.rcDensity=host
