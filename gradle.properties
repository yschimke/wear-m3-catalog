org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The patches in `patches/` introduce `expect class` where an Android type has to be abstracted.
# Kotlin still calls that Beta and warns per declaration; the warning is not actionable here.
kotlin.suppressExpectActualClasses=true
