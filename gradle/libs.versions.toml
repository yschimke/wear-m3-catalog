[versions]
kotlin = "2.4.10"
compose = "1.12.0"
androidx-annotation = "1.10.0"
androidx-collection = "1.6.0"
androidx-graphics-shapes = "1.1.0"

[libraries]
# Compose Multiplatform. Declared as explicit coordinates rather than through the `compose.*`
# accessors, which CMP 1.12 deprecates.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose" }
# Material 2, for `androidx.compose.material.ripple` and `material.icons` only. Not Material 3.
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }

# The three AndroidX libraries the Wear sources use that ALREADY publish wasmJs targets. They need
# no porting — see `transform-rules.json` for why they are absent from `androidOnlyPrefixes`.
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidx-collection" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "androidx-graphics-shapes" }

# Skia, through the same skiko build Compose Multiplatform renders with. Declared so `skikoMain`
# can name it; the version is pinned to what CMP 1.12.0 resolves, and moves with it.
skiko = { module = "org.jetbrains.skiko:skiko", version = "0.150.1" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
