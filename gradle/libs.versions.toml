[versions]
kotlin = "2.4.10"
ktfmt = "0.27.0"
agp = "9.4.0"

# Wear Compose Material 3 — the library this catalog reproduces the kit against.
wear-compose = "1.7.0-beta02"
wear-tooling-preview = "1.0.0"

# The mobile Compose BOM supplies `androidx.compose.ui`, the preview tooling and — see
# `catalog/build.gradle.kts` — `androidx.compose.material3.MaterialShapes`, which is where the 35
# shapes on the kit's Shapes page actually live. Wear Compose has no shape library of its own.
compose-bom = "2026.08.00"

# Mobile Material 3, pinned FORWARD of the BOM (which carries 1.4.0) solely for `MaterialShapes`
# and `RoundedPolygon.toShape()` — the expressive shape library, added on the 1.5.0-alpha line and
# the only published home of the 35 shapes the kit's Shapes page draws. The alpha's AAR metadata
# declares minCompileSdk 37, which is what `catalog/build.gradle.kts` already compiles at for
# wear-compose 1.7.0-beta. Drop the pin once 1.5.0 is stable in the BOM.
compose-material3 = "1.5.0-alpha27"

# compose-ai-tools: the `ee.schimke.composeai.preview` Gradle plugin and the annotation artifacts
# are one release — keep them pinned together (Renovate groups them; see .github/renovate.json).
composePreviewPlugin = "1.79.0"
composePreviewAnnotations = "1.79.0"

# rc-players — `ee.schimke.composeai:third-party-rc-embedded-player`. Same GROUP as the artifacts
# above and nothing else: it is published from yschimke/rc-players on a release line of its own,
# which moves separately and is already ahead. Sharing `composePreviewAnnotations` with it dragged
# the four compose-ai-tools artifacts to a version that does not exist (#199); it gets its own ref,
# and .github/renovate.json keeps it out of the compose-ai-tools group so the two cannot re-merge.
rcEmbeddedPlayer = "1.57.0"

# materialkolor — the dynamic-colour engine Confetti Wear builds its conference palettes with. The
# declared themes in `CatalogThemes.kt` reproduce them by running the same seed through the same
# library rather than transcribing the resolved roles, which is what stops the two drifting.
materialkolor = "5.0.1"

# Horologist — the Wear component library layered ON TOP of Wear Compose Material 3, and the only
# published home of the things the kit draws that the library itself does not ship: the media
# player and its parts (the kit's `Media-Player` set), the sign-in screens, and the fast-scrolling
# list. Its `*-material3` artifacts are the Wear M3 line; the un-suffixed ones are Material 2 and
# are deliberately not used here. Alpha, and moving — the artifacts are one release and Renovate
# groups them (see .github/renovate.json).
horologist = "0.8.4-alpha"

# ── Remote Compose, for `:remote-catalog` only ──────────────────────────────────────────────────
# The alpha line the Remote catalog renders against, resolved from Google Maven. The three groups
# MOVE TOGETHER: `wear-compose-remote:remote-material3` and `glance-wear:wear` are both built on
# `remote-creation*`, and a skewed pair fails at render time inside the player rather than at
# compile time (compose-ai-tools records what that cost: a `NoClassDefFoundError` in `RemoteButton`
# and a wear pin that briefly did not exist at all). Renovate must bump the trio in one PR, and a
# human reads the visual diff — see .github/renovate.json.
#
# Nothing here reaches `:catalog`. That module is on the stable Compose BOM and the Wear Compose
# beta line; this one deliberately is not, which is why the two are separate modules rather than
# two source sets (see remote-catalog/build.gradle.kts).
compose-remote = "1.0.0-alpha18"
wear-compose-remote = "1.0.0-alpha10"
glance-wear = "1.0.0-alpha17"

# Pre-release compose-ui for `:remote-catalog`. The alpha remote artifacts align with the Compose
# 1.11+ line (1.11.0 is the first release shipping `PreviewWrapper`), so that module pins explicit
# versions instead of taking the 2026.08.00 BOM the rest of the repo uses.
compose-ui-prerelease = "1.12.0"

activity-compose = "1.13.0"
truth = "1.4.5"

robolectric = "4.17-beta-4"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
# `Icons.Filled.*` — the icon set the kit's icon slots draw. Core only: the extended set is ~1000
# vectors this catalog does not reference.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# `Font(GoogleFont("Google Sans Flex"), provider)` — the declared themes' typefaces resolve as
# downloadable Google fonts rather than vendored TTFs, so this module ships no font bytes.
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
# `MaterialShapes` / `RoundedPolygon.toShape()` — the expressive shape library. Mobile Material 3
# because that is the only artifact that publishes it; see catalog/build.gradle.kts.
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }

wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-ui-tooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wear-compose" }
wear-tooling-preview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wear-tooling-preview" }

composeai-preview-annotations = { module = "ee.schimke.composeai:preview-annotations", version.ref = "composePreviewAnnotations" }
composeai-preview-overrides = { module = "ee.schimke.composeai:data-preview-overrides-runtime", version.ref = "composePreviewAnnotations" }

materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }

# Horologist. Four artifacts, one per surface this catalog publishes, plus the model and image
# types their APIs take as arguments:
#   media-ui-material3        `PlayerScreen`, `MediaControlButtons`, `PlayPauseProgressButton`, …
#   media-ui-model            `PlayerUiState`, `MediaUiModel`, `TrackPositionUiModel` — the state
#                             the media components render, needed to seed a sticker.
#   auth-composables-material3 `SignInButton`, `SelectAccountScreen`, `SignedInConfirmationDialog`, …
#   compose-layout            `FastScrollingTransformingLazyColumn` (its `…layout.m3` package).
#   images-base               `Paintable` — how every Horologist API takes an image. The catalog's
#                             stand-in artwork implements it.
horologist-media-ui-material3 = { module = "com.google.android.horologist:horologist-media-ui-material3", version.ref = "horologist" }
horologist-media-ui-model = { module = "com.google.android.horologist:horologist-media-ui-model", version.ref = "horologist" }
horologist-audio-ui-material3 = { module = "com.google.android.horologist:horologist-audio-ui-material3", version.ref = "horologist" }
horologist-auth-composables-material3 = { module = "com.google.android.horologist:horologist-auth-composables-material3", version.ref = "horologist" }
horologist-compose-layout = { module = "com.google.android.horologist:horologist-compose-layout", version.ref = "horologist" }
horologist-images-base = { module = "com.google.android.horologist:horologist-images-base", version.ref = "horologist" }

# ── Remote Compose (`:remote-catalog`) ─────────────────────────────────────────────────────────
# `remote-tooling-preview` declares its creation/compose deps at RUNTIME scope, so the compile
# classpath does not see the remote primitive types (`RemoteModifier`, `RemoteString`,
# `HostAction`, `RemoteBrush`, …) unless they are pulled in explicitly — hence the creation pair
# beside it rather than trusted to transitivity. Same for the glance-wear trio.
compose-remote-tooling-preview = { module = "androidx.compose.remote:remote-tooling-preview", version.ref = "compose-remote" }
compose-remote-creation = { module = "androidx.compose.remote:remote-creation", version.ref = "compose-remote" }
compose-remote-creation-compose = { module = "androidx.compose.remote:remote-creation-compose", version.ref = "compose-remote" }
wear-compose-remote-material3 = { module = "androidx.wear.compose.remote:remote-material3", version.ref = "wear-compose-remote" }
glance-wear = { module = "androidx.glance.wear:wear", version.ref = "glance-wear" }
glance-wear-core = { module = "androidx.glance.wear:wear-core", version.ref = "glance-wear" }
glance-wear-tooling-preview = { module = "androidx.glance.wear:wear-tooling-preview", version.ref = "glance-wear" }

# Compose UI at the prerelease line `:remote-catalog` needs, declared WITHOUT the BOM.
compose-ui-tooling-preview-prerelease = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-ui-prerelease" }
compose-ui-tooling-prerelease = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ui-prerelease" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# compose-ai-tools, `:remote-catalog` side. All three move with the plugin pin above — the CLI the
# render runs (`cli-version: catalog`) is resolved FROM that pin, and a connector/CLI skew breaks
# preview discovery outright.
#
#   data-remotecompose-connector    `RemoteOverridablePreview` + the `rememberOverridable*` knobs:
#                                   the sticker frame the catalog captures through, so a named
#                                   value is seedable in a live re-render and the captured
#                                   RemoteDocument lands in the bundle's `.rc` sidecar.
#   wear-preview-runtime            `CapturingWearWidgetPreview` — the glance-wear widget-container
#                                   wrapper that emits the encoded document as the render's IR.
#   third-party-rc-embedded-player  the EMBEDDED player, on the runtime classpath. See the
#                                   dependency block in remote-catalog/build.gradle.kts for why
#                                   this is the vendored coordinate and not upstream's published
#                                   `remote-player-compose`.
composeai-remotecompose-connector = { module = "ee.schimke.composeai:data-remotecompose-connector", version.ref = "composePreviewAnnotations" }
composeai-wear-preview-runtime = { module = "ee.schimke.composeai:wear-preview-runtime", version.ref = "composePreviewAnnotations" }
composeai-rc-embedded-player = { module = "ee.schimke.composeai:third-party-rc-embedded-player", version.ref = "rcEmbeddedPlayer" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composePreview = { id = "ee.schimke.composeai.preview", version.ref = "composePreviewPlugin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
