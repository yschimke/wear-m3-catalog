[versions]
kotlin = "2.4.20"
ktfmt = "0.27.0"
ktfmt-cli = "0.64"
agp = "9.4.1"

# Wear Compose Material 3 — the library this catalog reproduces the kit against.
wear-compose = "1.7.1"
wear-tooling-preview = "1.0.0"
# `LocalOnBackPressedDispatcherOwner`, which the one-handed-gesture samples read. Declared by
# upstream's own samples build.gradle; this module needs it for the same reason.
androidx-activity-compose = "1.13.0"
# Both Android catalogs otherwise settle on Emoji2 1.4.0 through Compose UI / AppCompat. Keep the
# atomic Emoji2 family on the current AndroidX line; the renderer packages these exact AAR bytes.
androidx-emoji2 = "1.7.0"

# The mobile Compose BOM supplies `androidx.compose.ui`, the preview tooling and — see
# `catalog/build.gradle.kts` — `androidx.compose.material3.MaterialShapes`, which is where the 35
# shapes on the kit's Shapes page actually live. Wear Compose has no shape library of its own.
compose-bom = "2026.09.00"

# The CMP Wear port — Wear Compose Material 3 / Foundation recompiled for Compose Multiplatform,
# published to the `wear-compose-cmp-maven` branch of yschimke/wear-m3-catalog-out (see `settings.gradle.kts` for
# the group-fenced repository and why it is fenced). The suffix is the port revision, which the
# port lane's CI requires to INCREASE rather than merely differ (#413), so a stale pin here is
# visible as a number rather than as a silently different artifact at the same coordinate.
#
# `:catalog` resolves this in `commonMain` ONLY. Every `android` configuration substitutes it back
# to `wear-compose` below, so the Robolectric renders — the published kit rendition — are drawn by
# the real AndroidX library, not by the port.
wearcmp-port = "1.7.1-cmp02"

# Compose Multiplatform. `commonMain` compiles against the JetBrains runtime/foundation/ui, which
# resolve to the androidx artifacts on the android target — same FQNs, so the port and the AARs are
# interchangeable at the source level, which is what makes one set of component bodies possible.
compose-multiplatform = "1.12.1"

# CMP Material 3, pinned FORWARD of the `compose-multiplatform` line above for exactly the reason
# `compose-material3` below is pinned forward of the BOM: `MaterialShapes` / `RoundedPolygon.toShape`
# are expressive-experimental and land only on the 1.12.0-alpha line. The two pins are the same
# decision expressed once per flavour and must move together.
compose-multiplatform-material3 = "1.12.0-alpha03"

# Mobile Material 3, pinned FORWARD of the BOM (which carries 1.4.0) solely for `MaterialShapes`
# and `RoundedPolygon.toShape()` — the expressive shape library, added on the 1.5.0-alpha line and
# the only published home of the 35 shapes the kit's Shapes page draws. The alpha's AAR metadata
# declares minCompileSdk 37, which is what `catalog/build.gradle.kts` already compiles at for
# wear-compose 1.7.0-beta. Drop the pin once 1.5.0 is stable in the BOM.
compose-material3 = "1.5.0-beta01"

# THE COMPOSE-PREVIEW VERSIONS: one per release line, and every ee.schimke.composeai module
# resolves through its line's BOM rather than carrying a version of its own.
#
# The plugin marker is the compose-ai-tools line. The runtime modules the catalog compiles against
# (`preview-annotations`, `data-preview-overrides-runtime`) ship from yschimke/compose-preview-daemon,
# and the UI-builder exporter ships from yschimke/compose-ui-builder. Both of those repositories
# publish only the modules that CHANGED in a release, and each release's BOM pins every module at
# its latest published version. So per-module versions diverge from the release version, and a
# direct pin at the release version 404s the first time a release skips a module: the daemon's
# 3.13.0 shipped `preview-annotations` but not `data-preview-overrides-runtime`, which one shared
# ref over the pair could only have pointed at a coordinate that does not exist (#199, #347 and
# #637 were the same bug on earlier lines). The modules in [libraries] are therefore VERSIONLESS and
# every module that uses them applies `platform(...)` of the BOM; never add a version to them.
composePreviewPlugin = "2.39.0"
# The release BOM can advance even when a partial release keeps the plugin unchanged.
composeAiTools = "2.39.0"
# The daemon release BOM aligns the annotations and preview renderer graph. It must not
# predate the daemon baked into the preview plugin; verifyComposePreviewDaemonAlignment
# checks that floor before compilation. Renovate updates this BOM independently.
composePreviewDaemon = "3.15.0"
composePreviewContracts = "3.24.0"

# compose-preview-ui-builder-bom, from yschimke/compose-ui-builder on a release line of its own. It
# resolves the UI-builder exporter, which is test-only: `WearScreenTemplateRoundTripTest` uses it to
# prove a screen design still generates the Kotlin checked in beside it, and the compiler proves
# that Kotlin still builds against `:catalog`'s own classpath. The 3.72.0 BOM pins the exporter at
# 3.72.0. Renovate moves it in its own group.
composeUiBuilder = "3.102.0"

# Synthetic source-composite coordinates for :catalog-ui-builder-renderer. There are deliberately
# no Maven artifacts at these names: settings.gradle.kts substitutes both from the checkout named
# by -PcomposeUiBuilderDir. Move to a released SDK coordinate only after the generic interpreter and
# adapter registry have completed their release cycle.
uiBuilderSource = "3.80.0"

# materialkolor — the dynamic-colour engine Confetti Wear builds its conference palettes with. The
# declared themes in `CatalogThemes.kt` reproduce them by running the same seed through the same
# library rather than transcribing the resolved roles, which is what stops the two drifting.
materialkolor = "5.0.1"

# Horologist — the Wear component library layered ON TOP of Wear Compose Material 3, and the only
# published home of the things the kit draws that the library itself does not ship: the media
# player and its parts (the kit's `Media-Player` set), the sign-in screens, and the fast-scrolling
# list. Its `*-material3` artifacts are the Wear M3 line; the un-suffixed ones are Material 2 and
# are deliberately not used here. Alpha, and moving — the artifacts are one release and Renovate
# groups them (see .github/renovate.json).
horologist = "0.8.4-alpha"

truth = "1.4.5"

robolectric = "4.17"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
# `Icons.*` — the icon set the kit's icon slots draw, CORE PLUS EXTENDED.
#
# The extended set is ~1000 vectors and most of them will never be referenced, which is the reason
# it used to be left out. That reasoning was wrong twice over. It is a PREVIEW-ONLY catalog: nothing
# here ships to a device, so the download is the whole cost and there is no app to bloat. And the
# saving bought a real loss — `:remote-catalog` had no icon dependency at all and hand-transcribed
# `Icons.Filled.Add`, `Check` and `Star` as `ImageVector.Builder` path data, so the two columns of
# a two-column comparison sheet drew icons from two different sources and any drift between them
# would have been reported as a difference the libraries do not cause. R8 strips what an app does
# not use; a preview catalog has no such worry to trade against.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# `Font(GoogleFont("Google Sans Flex"), provider)` — the declared themes' typefaces resolve as
# downloadable Google fonts rather than vendored TTFs, so this module ships no font bytes.
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
compose-ui-text-google-fonts-floor = { module = "androidx.compose.ui:ui-text-google-fonts", version = "1.12.1" }
# `MaterialShapes` / `RoundedPolygon.toShape()` — the expressive shape library. Mobile Material 3
# because that is the only artifact that publishes it; see catalog/build.gradle.kts.
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }

wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-ui-tooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wear-compose" }
wear-tooling-preview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wear-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-emoji2 = { module = "androidx.emoji2:emoji2", version.ref = "androidx-emoji2" }

composeai-tools-bom = { module = "ee.schimke.composeai:compose-ai-tools-bom", version.ref = "composeAiTools" }
composeai-contracts-bom = { module = "ee.schimke.composeai:compose-preview-contracts-bom", version.ref = "composePreviewContracts" }
composeai-daemon-bom = { module = "ee.schimke.composeai:compose-preview-daemon-bom", version.ref = "composePreviewDaemon" }
# Versionless: resolved through composeai-daemon-bom. Never add a version here.
composeai-preview-annotations = { module = "ee.schimke.composeai:preview-annotations" }
composeai-preview-overrides = { module = "ee.schimke.composeai:data-preview-overrides-runtime" }

materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
wearcmp-compose-material3 = { module = "ee.schimke.wearcmp:wear-compose-material3", version.ref = "wearcmp-port" }
wearcmp-compose-foundation = { module = "ee.schimke.wearcmp:wear-compose-foundation", version.ref = "wearcmp-port" }
compose-multiplatform-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform-material3" }
compose-multiplatform-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }

# Horologist. Four artifacts, one per surface this catalog publishes, plus the model and image
# types their APIs take as arguments:
#   media-ui-material3        `PlayerScreen`, `MediaControlButtons`, `PlayPauseProgressButton`, …
#   media-ui-model            `PlayerUiState`, `MediaUiModel`, `TrackPositionUiModel` — the state
#                             the media components render, needed to seed a sticker.
#   auth-composables-material3 `SignInButton`, `SelectAccountScreen`, `SignedInConfirmationDialog`, …
#   compose-layout            `FastScrollingTransformingLazyColumn` (its `…layout.m3` package).
#   images-base               `Paintable` — how every Horologist API takes an image. The catalog's
#                             stand-in artwork implements it.
horologist-media-ui-material3 = { module = "com.google.android.horologist:horologist-media-ui-material3", version.ref = "horologist" }
horologist-media-ui-model = { module = "com.google.android.horologist:horologist-media-ui-model", version.ref = "horologist" }
horologist-audio-ui-material3 = { module = "com.google.android.horologist:horologist-audio-ui-material3", version.ref = "horologist" }
horologist-auth-composables-material3 = { module = "com.google.android.horologist:horologist-auth-composables-material3", version.ref = "horologist" }
horologist-compose-layout = { module = "com.google.android.horologist:horologist-compose-layout", version.ref = "horologist" }
horologist-images-base = { module = "com.google.android.horologist:horologist-images-base", version.ref = "horologist" }

composeai-ui-builder-bom = { module = "ee.schimke.composeai:compose-preview-ui-builder-bom", version.ref = "composeUiBuilder" }
# Versionless: resolved through composeai-ui-builder-bom. Never add a version here.
composeai-ui-builder-export = { module = "ee.schimke.composeai:compose-preview-ui-builder-export" }
composeai-ui-builder-renderer-sdk-source = { module = "ee.schimke.composeai:ui-builder-renderer-sdk-source", version.ref = "uiBuilderSource" }
ktfmt-cli = { module = "com.facebook:ktfmt", version.ref = "ktfmt-cli" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composePreview = { id = "ee.schimke.composeai.preview", version.ref = "composePreviewPlugin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
